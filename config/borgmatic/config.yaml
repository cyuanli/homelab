source_directories:
  - /media/data/nextcloud/*/files
  - /media/data/immich/library/library
  - /media/data/owntracks/rec
  - /media/data/games
  - /media/data/db-dumps
  - /srv/app-storage/hermes

# Hermes caches and reinstallable tools, ~3GB. real data ~20MB
exclude_patterns:
  - /srv/app-storage/hermes/installs
  - /srv/app-storage/hermes/stt
  - /srv/app-storage/hermes/cache
  - /srv/app-storage/hermes/.cache
  - /srv/app-storage/hermes/.local
  - /srv/app-storage/hermes/.npm
  - /srv/app-storage/hermes/home/.cache
  - /srv/app-storage/hermes/home/.npm

repositories:
  - path: ssh://cyl-optiplex9020/media/archive/borg

# BORG_PASSPHRASE comes from borgmatic.service.
compression: zstd

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

checks:
  - name: repository
  - name: archives
  - name: data
    frequency: 1 month

before_backup:
  - kubectl exec -n cloud deployment/nextcloud -- su -s /bin/bash www-data -c "php /var/www/html/occ maintenance:mode --on"
  # after maintenance mode. no writes mid-dump
  - /home/cyl/homelab/scripts/backup-databases.sh

after_backup:
  - kubectl exec -n cloud deployment/nextcloud -- su -s /bin/bash www-data -c "php /var/www/html/occ maintenance:mode --off"
  - /home/cyl/homelab/scripts/backup-notify.sh success

on_error:
  # before notify. broken notify must not strand maintenance mode
  - kubectl exec -n cloud deployment/nextcloud -- su -s /bin/bash www-data -c "php /var/www/html/occ maintenance:mode --off"
  - /home/cyl/homelab/scripts/backup-notify.sh error
