source_directories:
  - /media/data/nextcloud/*/files

repositories:
  - path: ssh://cyl-optiplex9020/media/wd_elements/borg

encryption_passphrase: "floss-hunger-unpopular6"
compression: zstd

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

checks:
  - name: repository
  - name: archives

before_backup:
  - kubectl exec -n cloud deployment/nextcloud -- su -s /bin/bash www-data -c "php /var/www/html/occ maintenance:mode --on"

after_backup:
  - kubectl exec -n cloud deployment/nextcloud -- su -s /bin/bash www-data -c "php /var/www/html/occ maintenance:mode --off"

on_error:
  - /home/cyl/homelab/scripts/backup-notify.sh error
