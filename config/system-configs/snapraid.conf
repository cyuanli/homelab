parity /mnt/parity1/snapraid.parity

content /var/snapraid/snapraid.content
content /mnt/data1/snapraid.content
content /mnt/data2/snapraid.content
content /mnt/data3/snapraid.content
content /mnt/data4/snapraid.content

data d1 /mnt/data1
data d2 /mnt/data2
data d3 /mnt/data3
data d4 /mnt/data4

exclude *.tmp
exclude *.temp
exclude *.log
exclude *.bak
# Write-probes from monitor-storage.sh, unlinked immediately. A concurrent
# sync races against them otherwise.
exclude .disk-health-test.*
exclude Thumbs.db
exclude .DS_Store
exclude .snapshots/
exclude lost+found/
exclude /tmp/
exclude .Trashes/
# Rewritten by Home Assistant every 15 min; fails any sync that overlaps a write.
exclude /home-assistant/config/.storage/bluetooth.passive_update_processor
exclude /home-assistant/config/.storage/core.restore_state

block_size 256
autosave 250
