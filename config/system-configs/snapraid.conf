# SnapRAID Configuration
# Generated on 2025-08-29
# Backed up to repo on 2025-09-30

# Parity drive location
parity /mnt/parity1/snapraid.parity

# Content file locations (multiple copies for redundancy)
content /var/snapraid/snapraid.content
content /mnt/data1/snapraid.content
content /mnt/data2/snapraid.content
content /mnt/data3/snapraid.content
content /mnt/data4/snapraid.content

# Data drives (ordered by size)
data d1 /mnt/data1
data d2 /mnt/data2
data d3 /mnt/data3
data d4 /mnt/data4

# Exclusions (files to not protect)
exclude *.tmp
exclude *.temp
exclude *.log
exclude *.bak
# Transient write-probes dropped by scripts/monitor-storage.sh every 5 min
# (mktemp -p <mount> .disk-health-test.XXXX). They are created and unlinked
# immediately, so a concurrent sync can otherwise race against them.
exclude .disk-health-test.*
exclude Thumbs.db
exclude .DS_Store
exclude .snapshots/
exclude lost+found/
exclude /tmp/
exclude .Trashes/

# Configuration
block_size 256
autosave 250
