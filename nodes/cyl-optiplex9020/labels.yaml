# Node labels and taints for cyl-optiplex9020
# Apply with: kubectl apply -f labels.yaml
#
# Hardware specs: 4 CPUs, 8GB RAM
# Taints: Restrict to essential workloads only (monitoring, infrastructure)
apiVersion: v1
kind: Node
metadata:
  name: cyl-optiplex9020
  labels:
    homelab/cpu-tier: low
    homelab/memory-tier: low
spec:
  taints:
  - key: workload
    value: essential-only
    effect: NoSchedule
