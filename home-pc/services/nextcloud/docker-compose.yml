services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nextcloud

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nextcloud

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    volumes:
      - nextcloud_data:/var/www/html
      - /media/data/nextcloud:/var/www/html/data
      - ./custom-config.php:/var/www/html/config/custom.config.php:ro
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=drive.cliff.li
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=drive.cliff.li
      - OVERWRITECLIURL=https://drive.cliff.li
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`drive.cliff.li`)
      - traefik.http.routers.nextcloud.entrypoints=websecure
      - traefik.http.routers.nextcloud.tls.certresolver=letsencrypt
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
      - traefik.http.middlewares.nextcloud-security.headers.stsSeconds=15552000
      - traefik.http.middlewares.nextcloud-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.nextcloud-security.headers.frameDeny=true
      - traefik.http.middlewares.nextcloud-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.nextcloud-security.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.nextcloud-wellknown.redirectregex.permanent=true
      - traefik.http.middlewares.nextcloud-wellknown.redirectregex.regex=https://(.*)/.well-known/(?:card|cal)dav
      - traefik.http.middlewares.nextcloud-wellknown.redirectregex.replacement=https://$${1}/remote.php/dav/
      - traefik.http.routers.nextcloud.middlewares=nextcloud-security,nextcloud-wellknown
    networks:
      - traefik
      - nextcloud
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
  nextcloud_data:
  redis_data:

networks:
  traefik:
    external: true
  nextcloud:
    name: nextcloud
