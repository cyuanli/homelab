load_module modules/ngx_stream_module.so;

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

stream {
  log_format basic '$remote_addr [$time_local] '
                   '$protocol $status $bytes_sent $bytes_received '
                   '$session_time "$upstream_addr"';

  access_log /var/log/nginx/stream_access.log basic;
  error_log  /var/log/nginx/stream_error.log warn;

  # TCP 443 → Traefik (HTTPS)
  server {
    listen 443;
    listen [::]:443;
    proxy_pass 100.91.214.61:443;
    proxy_protocol on;
  }

  # UDP 443 → Traefik (HTTP/3)
  server {
    listen 443 udp;
    listen [::]:443 udp;
    proxy_pass 100.91.214.61:443;
  }

  # TCP 80 → Traefik (HTTP-01, redirects)
  server {
    listen 80;
    listen [::]:80;
    proxy_pass 100.91.214.61:80;
    proxy_protocol on;
  }

  # SSH passthrough
  server {
    listen 51422;
    listen [::]:51422;
    proxy_pass 100.91.214.61:22;
  }
}
