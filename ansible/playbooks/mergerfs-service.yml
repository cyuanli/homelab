# Opt-in, NOT imported by site.yml. Copies the unit but deliberately leaves it
# disabled: enabling it requires commenting out the mergerfs line in /etc/fstab
# first, or the pool gets double-mounted. Validate the crash-restart path first,
# see docs/STORAGE.md "Storage durability".
- name: Install mergerfs auto-restart service
  hosts: storage
  become: true
  tasks:
    - name: Copy mergerfs-media.service unit
      ansible.builtin.copy:
        src: ../../config/systemd/mergerfs-media.service
        dest: /etc/systemd/system/mergerfs-media.service
        mode: "0644"
      notify: Reload systemd

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
