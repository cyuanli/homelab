- name: Install and configure Tailscale
  hosts: all
  become: true
  tasks:
    - name: Check if Tailscale is installed
      ansible.builtin.command: which tailscale
      register: tailscale_check
      changed_when: false
      failed_when: false

    - name: Install Tailscale
      when: tailscale_check.rc != 0
      block:
        - name: Download Tailscale install script
          ansible.builtin.get_url:
            url: https://tailscale.com/install.sh
            dest: /tmp/tailscale-install.sh
            mode: "0755"

        - name: Run Tailscale install script
          ansible.builtin.command: /tmp/tailscale-install.sh
          changed_when: true

        - name: Remove install script
          ansible.builtin.file:
            path: /tmp/tailscale-install.sh
            state: absent

    - name: Check if Tailscale is connected
      ansible.builtin.command: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Connect to Tailscale
      ansible.builtin.command: tailscale up --authkey={{ tailscale_authkey }} --accept-routes
      when:
        - tailscale_authkey is defined
        - tailscale_status.rc != 0
      changed_when: true
      no_log: true
