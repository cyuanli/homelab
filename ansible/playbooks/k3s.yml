- name: Install K3s servers
  hosts: servers
  become: true
  serial: 1
  tasks:
    - name: Refuse if this host runs a K3s agent
      ansible.builtin.command: systemctl is-active k3s-agent
      register: k3s_other_role
      changed_when: false
      failed_when: k3s_other_role.rc == 0

    - name: Check if K3s is running
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_check
      changed_when: false
      failed_when: false

    - name: Install or reconfigure K3s server
      when: k3s_check.rc != 0 or (k3s_reconfigure | default(false) | bool)
      block:
        - name: Get Tailscale IP
          ansible.builtin.command: tailscale ip -4
          register: tailscale_ip
          changed_when: false

        - name: Build K3s server install command
          ansible.builtin.set_fact:
            k3s_install_args: >-
              server
              --write-kubeconfig-mode 644
              --disable traefik
              --disable servicelb
              --disable local-storage
              {% if cluster_token | default('') == '' %}--cluster-init{% else %}--server {{ k3s_server_url | default(server_url) }}{% endif %}
              {% if k3s_flannel_external_ip | bool %}--flannel-external-ip{% endif %}
              {{ k3s_node_args }}

        - name: Run K3s installer
          ansible.builtin.shell: >-
            curl -sfL https://get.k3s.io |
            INSTALL_K3S_VERSION="{{ k3s_version }}"
            {% if cluster_token | default('') != '' %}K3S_TOKEN="{{ cluster_token }}"{% endif %}
            sh -s - {{ k3s_install_args }}
          changed_when: true
          no_log: true

        - name: Wait for K3s to be active
          ansible.builtin.systemd:
            name: k3s
            state: started
          retries: 30
          delay: 4

        # serial: 1 only protects etcd quorum if the next server waits for this one.
        - name: Wait for node to be Ready
          ansible.builtin.command: >-
            k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=300s
          changed_when: false

    - name: Configure kubectl access
      block:
        - name: Create .kube directory
          ansible.builtin.file:
            path: "/home/{{ homelab_user }}/.kube"
            state: directory
            owner: "{{ homelab_user }}"
            group: "{{ homelab_user }}"
            mode: "0755"

        - name: Copy kubeconfig
          ansible.builtin.copy:
            src: /etc/rancher/k3s/k3s.yaml
            dest: "/home/{{ homelab_user }}/.kube/config"
            remote_src: true
            owner: "{{ homelab_user }}"
            group: "{{ homelab_user }}"
            mode: "0600"

        - name: Add KUBECONFIG to bashrc
          ansible.builtin.lineinfile:
            path: "/home/{{ homelab_user }}/.bashrc"
            line: "export KUBECONFIG=/home/{{ homelab_user }}/.kube/config"
            regexp: ^export KUBECONFIG=
            state: present

- name: Install K3s agents
  hosts: agents
  become: true
  tasks:
    - name: Refuse if this host runs a K3s server
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_other_role
      changed_when: false
      failed_when: k3s_other_role.rc == 0

    - name: Check if K3s agent is running
      ansible.builtin.command: systemctl is-active k3s-agent
      register: k3s_agent_check
      changed_when: false
      failed_when: false

    - name: Install or reconfigure K3s agent
      when: k3s_agent_check.rc != 0 or (k3s_reconfigure | default(false) | bool)
      block:
        - name: Get Tailscale IP
          ansible.builtin.command: tailscale ip -4
          register: tailscale_ip
          changed_when: false

        - name: Build K3s agent install command
          ansible.builtin.set_fact:
            k3s_install_args: >-
              agent
              --server {{ k3s_server_url | default(server_url) }}
              {{ k3s_node_args }}

        - name: Run K3s installer
          ansible.builtin.shell: >-
            curl -sfL https://get.k3s.io |
            INSTALL_K3S_VERSION="{{ k3s_version }}"
            K3S_TOKEN="{{ cluster_token }}"
            sh -s - {{ k3s_install_args }}
          changed_when: true
          no_log: true

        - name: Wait for K3s agent to be active
          ansible.builtin.systemd:
            name: k3s-agent
            state: started
          retries: 30
          delay: 4
