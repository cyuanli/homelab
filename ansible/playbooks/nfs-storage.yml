- name: Configure NFS server
  hosts: storage
  become: true
  vars:
    games_root: "{{ data_root }}/games"
  tasks:
    - name: Ensure required source directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dir_check
      loop:
        - "{{ data_root }}"
        - "{{ app_storage_root }}"
      failed_when: not dir_check.stat.exists

    - name: Create games directory
      ansible.builtin.file:
        path: "{{ games_root }}/minecraft/backups"
        state: directory
        owner: nobody
        group: nogroup
        mode: "0755"

    - name: Create service directories
      ansible.builtin.file:
        path: "{{ app_storage_root }}/traefik/acme"
        state: directory
        owner: nobody
        group: nogroup
        mode: "0755"

    # Do NOT collapse the blocks below into one uniform loop. Each service
    # writes as its own UID, a wrong owner silently costs it write access.
    - name: Create syncthing directories
      ansible.builtin.file:
        path: "{{ app_storage_root }}/{{ item.path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "{{ item.mode }}"
      loop:
        - { path: syncthing/data, mode: "0755" }
        # 0700: holds the device certificate and private key
        - { path: syncthing/config, mode: "0700" }

    - name: Create automation service directories
      ansible.builtin.file:
        path: "{{ app_storage_root }}/automation/{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        # Mosquitto drops to uid 1883. nobody here makes mosquitto.db
        # unwritable, losing retained messages and subscriptions.
        - { path: mosquitto-data, owner: "1883", group: "1883", mode: "02755" }
        - { path: zigbee2mqtt-data, owner: nobody, group: nogroup, mode: "02755" }

    # Once the binds are active these paths resolve to the bind TARGETS, so a
    # chmod here rewrites the underlying directory. Modes must match them.
    - name: Create export bind mount points
      ansible.builtin.file:
        path: "{{ exports_root }}/{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: media, mode: "0755" }
        - { path: configs, mode: "0755" }
        # setgid, matching /media/data/games
        - { path: games, mode: "02755" }

    - name: Add bind mounts to fstab
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: none
        opts: bind
        state: mounted
      loop:
        - { src: "{{ data_root }}", path: "{{ exports_root }}/media" }
        - { src: "{{ app_storage_root }}", path: "{{ exports_root }}/configs" }
        - { src: "{{ games_root }}", path: "{{ exports_root }}/games" }

    - name: Copy NFS exports configuration
      ansible.builtin.copy:
        src: ../../config/system-configs/exports
        dest: /etc/exports
        mode: "0644"
        backup: true
      notify: Apply NFS exports

    - name: Enable NFS server
      ansible.builtin.systemd:
        name: nfs-kernel-server
        enabled: true
        state: started

  handlers:
    - name: Apply NFS exports
      ansible.builtin.command: exportfs -ra
      changed_when: true
