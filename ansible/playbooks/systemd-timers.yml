- name: Deploy auto-remediate timer
  hosts: monitoring
  become: true
  tasks:
    - name: Copy auto-remediate units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/
        mode: "0644"
      loop:
        - ../../config/systemd/auto-remediate.service
        - ../../config/systemd/auto-remediate.timer
      notify: Reload systemd

    - name: Enable auto-remediate timer
      ansible.builtin.systemd:
        name: auto-remediate.timer
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

# Runs where the claude CLI is logged in and the repo lives
- name: Deploy claude-investigate timer
  hosts: cyl-homelab
  become: true
  tasks:
    # Otherwise journalctl only shows the user's own logs, not host services
    - name: Let the investigator read the system journal
      ansible.builtin.user:
        name: "{{ homelab_user }}"
        groups: systemd-journal
        append: true

    - name: Copy claude-investigate units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/
        mode: "0644"
      loop:
        - ../../config/systemd/claude-investigate.service
        - ../../config/systemd/claude-investigate.timer
      notify: Reload systemd

    - name: Enable claude-investigate timer
      ansible.builtin.systemd:
        name: claude-investigate.timer
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

- name: Deploy storage timers
  hosts: storage
  become: true
  tasks:
    - name: Copy disk-monitor units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/
        mode: "0644"
      loop:
        - ../../config/systemd/disk-monitor.service
        - ../../config/systemd/disk-monitor.timer
      notify: Reload systemd

    - name: Copy snapraid-runner units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/
        mode: "0644"
      loop:
        - ../../config/systemd/snapraid-runner.service
        - ../../config/systemd/snapraid-runner.timer
      notify: Reload systemd

    - name: Install smartd lockdown hook
      ansible.builtin.copy:
        src: ../../config/smartmontools/run.d/60monitor-storage
        dest: /etc/smartmontools/run.d/60monitor-storage
        mode: "0755"

    - name: Enable storage timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - disk-monitor.timer
        - snapraid-runner.timer

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
