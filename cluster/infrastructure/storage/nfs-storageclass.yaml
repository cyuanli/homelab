---
# Updated based on industry best practices (AWS, Azure, Red Hat, NetApp)
# See docs/NFS_MOUNT_OPTIONS_GUIDE.md for detailed explanation
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-media
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.1.94  # cyl-homelab IP
  share: /media/data
mountOptions:
  - vers=4.1            # NFSv4.1 (modern syntax, was: nfsvers)
  - hard                # Never give up on retries (prevents data corruption)
  - timeo=300           # 30s timeout - balanced between AWS default (60s) and fast failover
  - retrans=3           # 3 retries (one more than default for resilience)
  - rsize=1048576       # 1MB read buffer
  - wsize=1048576       # 1MB write buffer
  - _netdev             # Wait for network before mounting
  - noresvport          # Use new port on reconnection (better recovery)
  - noatime             # Don't update access times (10-30% performance boost)
  - actimeo=30          # Cache attributes for 30s (balance between performance and freshness)
  - lookupcache=positive # Only cache positive lookups (files that exist)
reclaimPolicy: Retain
volumeBindingMode: Immediate
