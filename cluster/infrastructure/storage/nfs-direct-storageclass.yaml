---
# No dynamic provisioning. Copy these mount options into every new NFS PV:
#   vers=4.1 hard timeo=300 retrans=3 rsize=1048576 wsize=1048576
#   _netdev noatime actimeo=30 lookupcache=positive
# Failover takes 1-2min.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-direct
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
