apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-tls
  namespace: infrastructure
spec:
  secretName: traefik-tls
  dnsNames:
    - traefik.cliff.li
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
# Only /ping is public; the dashboard stays on :8080 inside the network.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-health-ping
  namespace: infrastructure
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`traefik.cliff.li`) && PathPrefix(`/ping`)
    kind: Rule
    services:
    - name: traefik
      port: 8080
  tls:
    secretName: traefik-tls
