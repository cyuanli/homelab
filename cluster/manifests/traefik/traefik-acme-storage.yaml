---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: traefik-acme-nfs
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-direct
  mountOptions:
    - vers=4.1
    - hard
    - timeo=300
    - retrans=3
    - rsize=1048576
    - wsize=1048576
    - _netdev
    - noatime
    - actimeo=30
    - lookupcache=positive
  nfs:
    server: 192.168.1.94
    path: /configs/traefik/acme

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-acme-nfs
  namespace: infrastructure
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-direct
  volumeName: traefik-acme-nfs
  resources:
    requests:
      storage: 1Gi
