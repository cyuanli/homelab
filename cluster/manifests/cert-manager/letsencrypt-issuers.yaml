    # Production API
    server: https://acme-v02.api.letsencrypt.org/directory
    email: cliff.li@cliff.li

    # Store ACME account private key
    privateKeySecretRef:
      name: letsencrypt-production-account-key

    # Use HTTP-01 challenge
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik
          # Set high priority so challenge ingress takes precedence over PathPrefix: / routes
