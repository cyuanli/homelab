---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: owntracks-backups
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-direct
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 192.168.1.94
    path: /media/owntracks

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: owntracks-backups
  namespace: location
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-direct
  volumeName: owntracks-backups
  resources:
    requests:
      storage: 10Gi
