---
# Kubernetes CronJob for backing up Owntracks data from SSD to HDD
# Runs daily at 1 AM UTC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: owntracks-backup
  namespace: location
spec:
  # Run daily at 1 AM CET (midnight UTC)
  schedule: "0 0 * * *"

  # Keep last 3 successful jobs for history
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: owntracks-backup
        spec:
          restartPolicy: OnFailure

          # Run on cyl-homelab to access SSD storage
          nodeSelector:
            kubernetes.io/hostname: cyl-homelab

          containers:
          - name: backup
            image: alpine:latest
            command:
            - /bin/sh
            - -c
            - |
              set -e

              # Install rsync
              apk add --no-cache rsync

              echo "Starting Owntracks SSD to HDD backup: $(date)"

              # Sync from SSD to HDD (use --delete to mirror)
              echo "Syncing /ssd-data to /hdd-backup..."
              rsync -av --delete /ssd-data/ /hdd-backup/

              # Show size
              SIZE=$(du -sh /hdd-backup | cut -f1)
              echo "Backup completed successfully. Total size: $SIZE"

              echo "Recent files in backup:"
              ls -lth /hdd-backup/rec/cyl/s24/ | head -10

            volumeMounts:
            - name: owntracks-ssd
              mountPath: /ssd-data
              readOnly: true
            - name: owntracks-hdd
              mountPath: /hdd-backup

            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

          volumes:
          - name: owntracks-ssd
            hostPath:
              path: /srv/app-storage/owntracks
              type: Directory
          - name: owntracks-hdd
            persistentVolumeClaim:
              claimName: owntracks-backups
