---
# NFS PersistentVolume for Minecraft backups
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minecraft-backups
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-media
  mountOptions:
    - vers=4.1
    - hard
    - timeo=300
    - retrans=3
    - rsize=1048576
    - wsize=1048576
    - _netdev
    
    - noatime
    - actimeo=30
    - lookupcache=positive
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: minecraft-backups
    volumeAttributes:
      server: 192.168.1.94
      share: /

---
# PersistentVolumeClaim for backups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-backups
  namespace: games
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-media
  volumeName: minecraft-backups
  resources:
    requests:
      storage: 100Gi
