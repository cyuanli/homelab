apiVersion: v1
kind: Service
metadata:
  name: mc-router
  namespace: games
  labels:
    app: mc-router
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
    - name: api
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: mc-router
