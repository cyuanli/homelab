---
# Traefik TCP Router for Minecraft
# Routes TCP traffic from Traefik's minecraft entrypoint to the Minecraft service
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: minecraft
  namespace: games
spec:
  entryPoints:
    - minecraft
  routes:
    - match: HostSNI(`*`)
      services:
        - name: minecraft
          port: 25565
