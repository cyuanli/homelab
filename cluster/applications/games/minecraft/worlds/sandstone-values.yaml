# Idled deliberately. Drop this and the chart default (1) makes any
# `helm upgrade` silently restart the world.
replicaCount: 0

minecraftServer:
  eula: true

  version: "LATEST"
  type: "FABRIC"

  difficulty: normal
  maxPlayers: 20
  motd: "it gets everywhere"
  mode: survival
  pvp: true
  onlineMode: true
  spawnProtection: 0

  whitelist: "prim_plum,sirolol,Schluedi"

  modrinth:
    projects:
      - ferrite-core
      - lithium

  levelSeed: ""
  viewDistance: 10

  memory: 2G

  rcon:
    enabled: true
    password: "sandstone-rcon-2025"

  serviceType: ClusterIP

serviceAnnotations:
  mc-router.itzg.me/externalServerName: "sandstone.mc.cliff.li"

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    memory: 4Gi

persistence:
  storageClass: local-path
  dataDir:
    enabled: true
    Size: 50Gi

# local-path PV is node-local, the pod must stay on this node.
nodeSelector:
  kubernetes.io/hostname: cyl-mitx

tolerations: []
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - cyl-mitx
