# Minecraft Fabric Server with Cobblemon - Helm Values
# Chart: itzg/minecraft

minecraftServer:
  # Accept EULA
  eula: true

  # Server version and type
  version: "1.21.1"
  type: "FABRIC"

  # Server properties
  difficulty: normal
  maxPlayers: 20
  motd: "i wanna be the very best"
  mode: survival
  pvp: true
  onlineMode: true
  spawnProtection: 0

  # Modrinth mods to install
  modrinth:
    projects:
      - fabric-api
      - cobblemon
      - ferrite-core
      - lithium

  # World settings
  levelSeed: ""
  viewDistance: 10

  # Server performance
  memory: 4G

  # RCON for remote console access
  rcon:
    enabled: true
    password: "apricorn-rcon-2025"

  # Network service type (ClusterIP for mc-router integration)
  serviceType: ClusterIP

# mc-router integration - route apricorn.mc.cliff.li to this server
serviceAnnotations:
  mc-router.itzg.me/externalServerName: "apricorn.mc.cliff.li"

# Resource requests - no limits to allow bursting
resources:
  requests:
    cpu: 1000m
    memory: 2Gi

# Storage - Local SSD for performance
persistence:
  storageClass: local-path
  dataDir:
    enabled: true
    Size: 50Gi

# Pin to cyl-mitx node for consistent local storage
nodeSelector:
  kubernetes.io/hostname: cyl-mitx

# Ensure pod stays on same node (required for local-path)
tolerations: []
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - cyl-mitx
