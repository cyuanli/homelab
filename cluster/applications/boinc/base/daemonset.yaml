apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boinc-client
  namespace: boinc
  labels:
    app: boinc-client
spec:
  selector:
    matchLabels:
      app: boinc-client
  template:
    metadata:
      labels:
        app: boinc-client
    spec:
      # Low priority - will be preempted by real workloads
      priorityClassName: low-priority-preemptible

      # Allow scheduling on control plane
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

      # Init container to handle project attachment
      initContainers:
      - name: setup-projects
        image: boinc/client:latest
        command:
        - /bin/bash
        - -c
        - |
          # Start BOINC temporarily in background
          /usr/bin/boinc --dir /var/lib/boinc --allow_remote_gui_rpc &
          BOINC_PID=$!

          # Wait for BOINC to be ready
          echo "Waiting for BOINC to start..."
          for i in {1..30}; do
            if /usr/bin/boinccmd --get_cc_status >/dev/null 2>&1; then
              echo "BOINC ready"
              break
            fi
            sleep 2
          done

          # Attach to Einstein@home if not already attached
          if /usr/bin/boinccmd --get_project_status 2>/dev/null | grep -q "einsteinathome.org"; then
            echo "Already attached to Einstein@home"
          else
            echo "Attaching to Einstein@home..."
            /usr/bin/boinccmd --project_attach https://einsteinathome.org/ "$EINSTEIN_AUTH" 2>&1 || true
            sleep 5
          fi

          # Attach to World Community Grid if not already attached
          if /usr/bin/boinccmd --get_project_status 2>/dev/null | grep -q "worldcommunitygrid.org"; then
            echo "Already attached to World Community Grid"
          else
            echo "Attaching to World Community Grid..."
            /usr/bin/boinccmd --project_attach https://www.worldcommunitygrid.org/ "$WCG_AUTH" 2>&1 || true
            sleep 5
          fi

          # Attach to DENIS@home if not already attached
          if /usr/bin/boinccmd --get_project_status 2>/dev/null | grep -q "denisathome"; then
            echo "Already attached to DENIS@home"
          else
            echo "Attaching to DENIS@home..."
            /usr/bin/boinccmd --project_attach https://denis.usj.es/denisathome/ "$DENIS_AUTH" 2>&1 || true
            sleep 5
          fi

          # Attach to Milkyway@home if not already attached
          if /usr/bin/boinccmd --get_project_status 2>/dev/null | grep -q "milkyway"; then
            echo "Already attached to Milkyway@home"
          else
            echo "Attaching to Milkyway@home..."
            /usr/bin/boinccmd --project_attach https://milkyway.cs.rpi.edu/milkyway/ "$MILKYWAY_AUTH" 2>&1 || true
            sleep 5
          fi

          # Attach to SiDock@home if not already attached
          if /usr/bin/boinccmd --get_project_status 2>/dev/null | grep -q "sidock"; then
            echo "Already attached to SiDock@home"
          else
            echo "Attaching to SiDock@home..."
            /usr/bin/boinccmd --project_attach https://www.sidock.si/sidock/ "$SIDOCK_AUTH" 2>&1 || true
            sleep 5
          fi

          # Attach to Asteroids@home if not already attached
          if /usr/bin/boinccmd --get_project_status 2>/dev/null | grep -q "asteroidsathome"; then
            echo "Already attached to Asteroids@home"
          else
            echo "Attaching to Asteroids@home..."
            /usr/bin/boinccmd --project_attach https://asteroidsathome.net/boinc/ "$ASTEROIDS_AUTH" 2>&1 || true
            sleep 5
          fi

          # Attach to Yoyo@home if not already attached
          if /usr/bin/boinccmd --get_project_status 2>/dev/null | grep -q "yoyo"; then
            echo "Already attached to Yoyo@home"
          else
            echo "Attaching to Yoyo@home..."
            /usr/bin/boinccmd --project_attach https://www.rechenkraft.net/yoyo/ "$YOYO_AUTH" 2>&1 || true
            sleep 5
          fi

          # Attach to Climateprediction.net if not already attached
          if /usr/bin/boinccmd --get_project_status 2>/dev/null | grep -q "climateprediction"; then
            echo "Already attached to Climateprediction.net"
          else
            echo "Attaching to Climateprediction.net..."
            /usr/bin/boinccmd --project_attach https://www.climateprediction.net/ "$CLIMATE_AUTH" 2>&1 || true
            sleep 5
          fi

          # Stop temporary BOINC instance
          kill $BOINC_PID 2>/dev/null || true
          wait $BOINC_PID 2>/dev/null || true

          echo "Setup complete"
        env:
        - name: BOINC_GUI_RPC_PASSWORD
          value: "boinc123"
        - name: EINSTEIN_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: einstein-auth
        - name: WCG_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: worldcommunitygrid-auth
        - name: DENIS_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: denis-auth
        - name: MILKYWAY_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: milkyway-auth
        - name: SIDOCK_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: sidock-auth
        - name: ASTEROIDS_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: asteroids-auth
        - name: YOYO_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: yoyo-auth
        - name: CLIMATE_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: climateprediction-auth
        volumeMounts:
        - name: boinc-data
          mountPath: /var/lib/boinc
        - name: boinc-config
          mountPath: /var/lib/boinc/cc_config.xml
          subPath: cc_config.xml
        - name: boinc-config
          mountPath: /var/lib/boinc/global_prefs_override.xml
          subPath: global_prefs_override.xml

      containers:
      - name: boinc-client
        image: boinc/client:latest
        imagePullPolicy: Always

        # Environment variables
        env:
        - name: BOINC_GUI_RPC_PASSWORD
          value: "boinc123"

        # BOINC command line arguments
        command: ["/usr/bin/boinc"]
        args: ["--allow_remote_gui_rpc", "--dir", "/var/lib/boinc"]

        # Volume mounts for configuration and data persistence
        volumeMounts:
        - name: boinc-data
          mountPath: /var/lib/boinc
        - name: boinc-config
          mountPath: /var/lib/boinc/cc_config.xml
          subPath: cc_config.xml
        - name: boinc-config
          mountPath: /var/lib/boinc/global_prefs_override.xml
          subPath: global_prefs_override.xml

        # Health checks
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep boinc || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep boinc && ls /var/lib/boinc/client_state.xml"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: boinc-data
        emptyDir:
          sizeLimit: 20Gi
      - name: boinc-config
        configMap:
          name: boinc-config

      # Security context
      securityContext:
        runAsUser: 0
        fsGroup: 0

      # Restart policy
      restartPolicy: Always
