apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boinc-client
  namespace: boinc
  labels:
    app: boinc-client
spec:
  selector:
    matchLabels:
      app: boinc-client
  template:
    metadata:
      labels:
        app: boinc-client
    spec:
      # Low priority - will be preempted by real workloads
      priorityClassName: low-priority-preemptible

      # Allow scheduling on control plane
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

      # Init container to handle project attachment
      initContainers:
      - name: setup-projects
        image: boinc/client:latest
        command:
        - /bin/bash
        - -c
        - |
          # Start BOINC temporarily in background
          /usr/bin/boinc --dir /var/lib/boinc --allow_remote_gui_rpc &
          BOINC_PID=$!

          # Wait for BOINC to be ready
          echo "Waiting for BOINC to start..."
          for i in {1..30}; do
            if /usr/bin/boinccmd --get_cc_status >/dev/null 2>&1; then
              echo "BOINC ready"
              break
            fi
            sleep 2
          done

          # Define BOINC projects to attach (name|url|grep_pattern|auth_var)
          declare -A projects=(
            ["Einstein@home"]="https://einsteinathome.org/|einsteinathome.org|$EINSTEIN_AUTH"
            ["World Community Grid"]="https://www.worldcommunitygrid.org/|worldcommunitygrid.org|$WCG_AUTH"
            ["DENIS@home"]="https://denis.usj.es/denisathome/|denisathome|$DENIS_AUTH"
            ["Milkyway@home"]="https://milkyway.cs.rpi.edu/milkyway/|milkyway|$MILKYWAY_AUTH"
            ["SiDock@home"]="https://www.sidock.si/sidock/|sidock|$SIDOCK_AUTH"
            ["Asteroids@home"]="https://asteroidsathome.net/boinc/|asteroidsathome|$ASTEROIDS_AUTH"
            ["Yoyo@home"]="https://www.rechenkraft.net/yoyo/|yoyo|$YOYO_AUTH"
            ["Climateprediction.net"]="https://www.climateprediction.net/|climateprediction|$CLIMATE_AUTH"
          )

          # Attach to all configured projects
          for project in "${!projects[@]}"; do
            IFS='|' read -r url grep_pattern auth <<< "${projects[$project]}"

            if /usr/bin/boinccmd --get_project_status 2>/dev/null | grep -q "$grep_pattern"; then
              echo "Already attached to $project"
            else
              echo "Attaching to $project..."
              /usr/bin/boinccmd --project_attach "$url" "$auth" 2>&1 || true
              sleep 5
            fi
          done

          # Stop temporary BOINC instance
          kill $BOINC_PID 2>/dev/null || true
          wait $BOINC_PID 2>/dev/null || true

          echo "Setup complete"
        env:
        - name: BOINC_GUI_RPC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: gui-rpc-password
        - name: EINSTEIN_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: einstein-auth
        - name: WCG_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: worldcommunitygrid-auth
        - name: DENIS_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: denis-auth
        - name: MILKYWAY_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: milkyway-auth
        - name: SIDOCK_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: sidock-auth
        - name: ASTEROIDS_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: asteroids-auth
        - name: YOYO_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: yoyo-auth
        - name: CLIMATE_AUTH
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: climateprediction-auth
        volumeMounts:
        - name: boinc-data
          mountPath: /var/lib/boinc
        - name: boinc-config
          mountPath: /var/lib/boinc/cc_config.xml
          subPath: cc_config.xml
        - name: boinc-config
          mountPath: /var/lib/boinc/global_prefs_override.xml
          subPath: global_prefs_override.xml
        # LXCFS virtualized /proc files
        - name: lxcfs-proc-meminfo
          mountPath: /proc/meminfo
        - name: lxcfs-proc-cpuinfo
          mountPath: /proc/cpuinfo
        - name: lxcfs-proc-stat
          mountPath: /proc/stat
        - name: lxcfs-proc-uptime
          mountPath: /proc/uptime

      containers:
      - name: boinc-client
        image: boinc/client:latest
        imagePullPolicy: Always

        # Environment variables
        env:
        - name: BOINC_GUI_RPC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: boinc-credentials
              key: gui-rpc-password

        # BOINC command line arguments
        command: ["/usr/bin/boinc"]
        args: ["--allow_remote_gui_rpc", "--dir", "/var/lib/boinc"]

        # Volume mounts for configuration and data persistence
        volumeMounts:
        - name: boinc-data
          mountPath: /var/lib/boinc
        - name: boinc-config
          mountPath: /var/lib/boinc/cc_config.xml
          subPath: cc_config.xml
        - name: boinc-config
          mountPath: /var/lib/boinc/global_prefs_override.xml
          subPath: global_prefs_override.xml
        # LXCFS virtualized /proc files
        - name: lxcfs-proc-meminfo
          mountPath: /proc/meminfo
        - name: lxcfs-proc-cpuinfo
          mountPath: /proc/cpuinfo
        - name: lxcfs-proc-stat
          mountPath: /proc/stat
        - name: lxcfs-proc-uptime
          mountPath: /proc/uptime

        # Health checks
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep boinc || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep boinc && ls /var/lib/boinc/client_state.xml"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: boinc-data
        emptyDir:
          sizeLimit: 20Gi
      - name: boinc-config
        configMap:
          name: boinc-config
      # LXCFS virtualized /proc files from host
      - name: lxcfs-proc-meminfo
        hostPath:
          path: /var/lib/lxcfs/proc/meminfo
          type: File
      - name: lxcfs-proc-cpuinfo
        hostPath:
          path: /var/lib/lxcfs/proc/cpuinfo
          type: File
      - name: lxcfs-proc-stat
        hostPath:
          path: /var/lib/lxcfs/proc/stat
          type: File
      - name: lxcfs-proc-uptime
        hostPath:
          path: /var/lib/lxcfs/proc/uptime
          type: File

      # Security context
      securityContext:
        runAsUser: 0
        fsGroup: 0

      # Restart policy
      restartPolicy: Always
