# Strategic merge patch to override memory fractions for xlarge profile
# Tuned to keep memory usage under the 12Gi Kubernetes limit
# Since BOINC detects host memory (~15.57 GB), we calculate fractions to match our overlay limit:
#   - Idle: 0.74 * 15.57 GB ≈ 11.5 GB (stays under 12Gi)
#   - Busy: 0.67 * 15.57 GB ≈ 10.5 GB (stays under 12Gi)
apiVersion: v1
kind: ConfigMap
metadata:
  name: boinc-config
  namespace: boinc
data:
  cc_config.xml: |
    <cc_config>
      <log_flags>
        <task>1</task>
        <file_xfer>1</file_xfer>
        <sched_ops>1</sched_ops>
      </log_flags>
      <options>
        <allow_multiple_clients>1</allow_multiple_clients>
        <start_delay>10</start_delay>
        <!-- Use 75% of available CPUs -->
        <max_ncpus_pct>75</max_ncpus_pct>
        <!-- Memory fractions calculated to match 12Gi Kubernetes limit -->
        <!-- BOINC detects ~15.57GB host memory, so these fractions keep us under 12Gi -->
        <ram_max_used_busy_frac>0.67</ram_max_used_busy_frac>
        <ram_max_used_idle_frac>0.74</ram_max_used_idle_frac>
        <!-- Network settings -->
        <network_test_url>http://www.google.com/</network_test_url>
        <dont_verify_images>1</dont_verify_images>
      </options>
    </cc_config>
