apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boinc

# Name suffix to distinguish DaemonSets
nameSuffix: -xlarge

# Common labels for all resources
labels:
  - pairs:
      boinc.homelab/profile: xlarge
      boinc.homelab/cpu-tier: high
      boinc.homelab/memory-tier: high

resources:
  - ../../base

patches:
  - path: resources.yaml
    target:
      kind: DaemonSet
      name: boinc-client
  - path: node-selector.yaml
    target:
      kind: DaemonSet
      name: boinc-client
