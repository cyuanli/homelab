# Tier 4: Low CPU (4 cores) + Low Memory (8GB)
# Resource limits for cyl-yoga213, cyl-inspiron14
# Burstable QoS: Low request for easy scheduling, high limit to use available resources
# With low-priority-preemptible, BOINC yields to other workloads but uses all CPUs when idle
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boinc-client
spec:
  template:
    spec:
      containers:
      - name: boinc-client
        resources:
          requests:
            cpu: "1"      # Low request for easy scheduling
            memory: 6Gi   # Match limit for memory
          limits:
            cpu: "3"      # Can use all 3 allocatable CPUs when available (4 total - 1 reserved)
            memory: 6Gi   # 6GB out of 8GB
