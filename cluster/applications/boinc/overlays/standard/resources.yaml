# Tier 4: Low CPU (4 cores) + Low Memory (8GB)
# Resource limits for cyl-yoga213, cyl-inspiron14
# Burstable QoS: No CPU limits to allow proportional sharing via requests
# With low-priority-preemptible, BOINC gets CPU proportional to requests (500m)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boinc-client
spec:
  template:
    spec:
      containers:
      - name: boinc-client
        resources:
          requests:
            cpu: "500m"   # Equal weight to production workloads for fair sharing
            memory: 2Gi   # Low request for scheduling, configmap controls actual usage
          limits:
            memory: 6Gi   # 6GB out of 8GB
