# Tier 4: Low CPU (4 cores) + Low Memory (8GB)
# Resource limits for cyl-yoga213, cyl-inspiron14
# Burstable QoS: No CPU limits to allow proportional sharing via requests
# With low-priority-preemptible + 10m request, BOINC gets ~0.5-5% CPU when competing
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boinc-client
spec:
  template:
    spec:
      containers:
      - name: boinc-client
        resources:
          requests:
            cpu: "10m"    # Minimal weight - BOINC becomes nearly invisible when other workloads run
            memory: 2Gi   # Low request for scheduling, configmap controls actual usage
          limits:
            memory: 4Gi   # 4GB safe limit for ~5GB allocatable nodes
