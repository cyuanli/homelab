# Tier 4: Low CPU (4 cores) + Low Memory (8GB)
# Resource limits for cyl-yoga213, cyl-optiplex9020, cyl-inspiron14
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boinc-client
spec:
  template:
    spec:
      containers:
      - name: boinc-client
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "3"      # 3 out of 4 cores
            memory: 6Gi   # 6GB out of 8GB
