# Strategic merge patch to override memory fractions for standard profile
# Tuned to keep memory usage under the 5Gi target (node allocatable ~5.17Gi)
# Since BOINC detects host memory (~7.65 GB), we calculate fractions to match our target:
#   - Idle: 0.65 * 7.65 GB ≈ 5.0 GB (stays under 5.17Gi allocatable)
#   - Busy: 0.60 * 7.65 GB ≈ 4.6 GB (conservative, leaves room)
apiVersion: v1
kind: ConfigMap
metadata:
  name: boinc-config
  namespace: boinc
data:
  cc_config.xml: |
    <cc_config>
      <log_flags>
        <task>1</task>
        <file_xfer>1</file_xfer>
        <sched_ops>1</sched_ops>
      </log_flags>
      <options>
        <allow_multiple_clients>1</allow_multiple_clients>
        <start_delay>10</start_delay>
        <!-- Use 75% of available CPUs -->
        <max_ncpus_pct>75</max_ncpus_pct>
        <!-- Memory fractions calculated to stay under node allocatable -->
        <!-- BOINC detects ~7.65GB host memory, these fractions keep us under 5Gi -->
        <ram_max_used_busy_frac>0.60</ram_max_used_busy_frac>
        <ram_max_used_idle_frac>0.65</ram_max_used_idle_frac>
        <!-- Network settings -->
        <network_test_url>http://www.google.com/</network_test_url>
        <dont_verify_images>1</dont_verify_images>
      </options>
    </cc_config>
