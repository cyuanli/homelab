# Strategic merge patch to override memory fractions for highmem profile
# Tuned to keep memory usage under the 12Gi target (node allocatable ~12.91Gi)
# Since BOINC detects host memory (~15.39 GB), we calculate fractions to match our target:
#   - Idle: 0.75 * 15.39 GB ≈ 11.5 GB (stays under 12Gi limit)
#   - Busy: 0.70 * 15.39 GB ≈ 10.8 GB (conservative, leaves room)
apiVersion: v1
kind: ConfigMap
metadata:
  name: boinc-config
  namespace: boinc
data:
  cc_config.xml: |
    <cc_config>
      <log_flags>
        <task>1</task>
        <file_xfer>1</file_xfer>
        <sched_ops>1</sched_ops>
      </log_flags>
      <options>
        <allow_multiple_clients>1</allow_multiple_clients>
        <start_delay>10</start_delay>
        <!-- Use 75% of available CPUs -->
        <max_ncpus_pct>75</max_ncpus_pct>
        <!-- Memory fractions calculated to stay under node allocatable -->
        <!-- BOINC detects ~15.39GB host memory, these fractions keep us under 12Gi -->
        <ram_max_used_busy_frac>0.70</ram_max_used_busy_frac>
        <ram_max_used_idle_frac>0.75</ram_max_used_idle_frac>
        <!-- Network settings -->
        <network_test_url>http://www.google.com/</network_test_url>
        <dont_verify_images>1</dont_verify_images>
      </options>
    </cc_config>
