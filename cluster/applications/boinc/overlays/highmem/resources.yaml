# Tier 2: Low CPU (4 cores) + High Memory (16GB)
# Resource limits for cyl-aspiree17
# Burstable QoS: Low request for easy scheduling, high limit to use available resources
# With low-priority-preemptible, BOINC yields to other workloads but uses all CPUs when idle
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boinc-client
spec:
  template:
    spec:
      containers:
      - name: boinc-client
        resources:
          requests:
            cpu: "1"       # Low request for easy scheduling
            memory: 12Gi   # Match limit for memory
          limits:
            cpu: "2"       # Can use all 2 allocatable CPUs when available (4 total - 2 reserved)
            memory: 12Gi   # 12GB out of 16GB
