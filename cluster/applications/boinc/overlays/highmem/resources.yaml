# Tier 2: Low CPU (4 cores) + High Memory (16GB)
# Resource limits for cyl-aspiree17
# Burstable QoS: No CPU limits to allow proportional sharing via requests
# With low-priority-preemptible + 0m request, BOINC only uses idle CPU
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boinc-client
spec:
  template:
    spec:
      containers:
      - name: boinc-client
        resources:
          requests:
            cpu: "0m"      # Zero weight - BOINC only uses truly idle CPU, yields to all workloads with requests
            memory: 2Gi    # Low request for scheduling, configmap controls actual usage
          limits:
            memory: 8Gi   # 8GB conservative limit with headroom for other workloads
