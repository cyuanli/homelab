apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: boinc-client
spec:
  template:
    spec:
      containers:
      - name: boinc-client
        resources:
          requests:
            cpu: "0m"      # Zero weight, BOINC gets only idle CPU.
            memory: 2Gi
          limits:
            memory: 8Gi
