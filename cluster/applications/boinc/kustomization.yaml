apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: boinc
  namespace: boinc

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - project-attachments.yaml

commonLabels:
  app.kubernetes.io/name: boinc
  app.kubernetes.io/component: scientific-computing
  app.kubernetes.io/part-of: homelab