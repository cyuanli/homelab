---
# Single mount so downloads and library can hardlink.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-direct
  volumeName: media-data
  resources:
    requests:
      storage: 7Ti

