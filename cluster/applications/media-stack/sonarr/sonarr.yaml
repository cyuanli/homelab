apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
  labels:
    app: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 8989
          name: http
        volumeMounts:
        - name: sonarr-config
          mountPath: /config
        - name: tv-shows
          mountPath: /tv
        - name: downloads
          mountPath: /downloads
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: sonarr-config
        hostPath:
          path: /home/cyl/k3s-configs/media-stack/sonarr-config
          type: DirectoryOrCreate
      - name: tv-shows
        hostPath:
          path: /media/data/media/tv
          type: Directory
      - name: downloads
        hostPath:
          path: /media/data/downloads
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
  labels:
    app: sonarr
spec:
  type: ClusterIP
  ports:
  - port: 8989
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: sonarr