apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        - name: JELLYFIN_PublishedServerUrl
          value: "https://jellyfin.cliff.li"
        ports:
        - containerPort: 8096
          name: http
        - containerPort: 8920
          name: https
        volumeMounts:
        - name: jellyfin-config
          mountPath: /config
        - name: jellyfin-cache
          mountPath: /cache
        - name: movies
          mountPath: /movies
        - name: tv-shows
          mountPath: /tv
        - name: music
          mountPath: /music
        - name: downloads
          mountPath: /downloads
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - cyl-homelab
      volumes:
      - name: jellyfin-config
        hostPath:
          path: /home/cyl/k3s-configs/media-stack/jellyfin-config
          type: DirectoryOrCreate
      - name: jellyfin-cache
        hostPath:
          path: /home/cyl/k3s-configs/media-stack/jellyfin-cache
          type: DirectoryOrCreate
      - name: movies
        hostPath:
          path: /media/data/media/movies
          type: Directory
      - name: tv-shows
        hostPath:
          path: /media/data/media/tv
          type: Directory
      - name: music
        hostPath:
          path: /media/data/media/music
          type: Directory
      - name: downloads
        hostPath:
          path: /media/data/downloads
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  type: ClusterIP
  ports:
  - port: 8096
    targetPort: http
    protocol: TCP
    name: http
  - port: 8920
    targetPort: https
    protocol: TCP
    name: https
  selector:
    app: jellyfin