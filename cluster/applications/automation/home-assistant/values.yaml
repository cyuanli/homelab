# Recreate: the config lock file lives on shared storage.
controller:
  type: Deployment
  strategy: Recreate

image:
  repository: ghcr.io/home-assistant/home-assistant
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  existingClaim: home-assistant-config

service:
  type: ClusterIP
  port: 8123

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Ingress lives in ingress.yaml.
ingress:
  enabled: false

env:
  - name: TZ
    value: "Europe/Berlin"
