---
# MariaDB data storage on SSD via NFS
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mariadb-home-assistant-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-direct
  mountOptions:
    - vers=4.1
    - hard
    - timeo=300
    - retrans=3
    - rsize=1048576
    - wsize=1048576
    - _netdev
    - noatime
    - sync
  nfs:
    server: 192.168.1.94
    path: /configs/automation/mariadb-data
