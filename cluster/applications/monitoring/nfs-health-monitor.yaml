---
# ServiceAccount for NFS health monitor
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfs-health-monitor
  namespace: kube-system
---
# ClusterRole with permissions to delete pods and CSI driver pods
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nfs-health-monitor
rules:
  # Read all pods to find affected ones
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Delete pods for recovery
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
# Bind the ClusterRole to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nfs-health-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nfs-health-monitor
subjects:
  - kind: ServiceAccount
    name: nfs-health-monitor
    namespace: kube-system
---
# DaemonSet to run NFS health monitoring on all nodes
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nfs-health-monitor
  namespace: kube-system
  labels:
    app: nfs-health-monitor
spec:
  selector:
    matchLabels:
      app: nfs-health-monitor
  template:
    metadata:
      labels:
        app: nfs-health-monitor
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: "Exists"
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: nfs-health-monitor
      containers:
        - name: nfs-monitor
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              # Install required tools
              apk add --no-cache bash coreutils findutils curl jq netcat-openbsd

              # Install kubectl
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x kubectl
              mv kubectl /usr/local/bin/

              # Persistent counters across iterations
              TOTAL_RECOVERY_ATTEMPTS=0
              TOTAL_RECOVERY_SUCCESSES=0

              # Monitor loop - check every minute
              while true; do
                echo "[$(date)] Running NFS health check..."

                # NFS server to check
                NFS_SERVER="192.168.1.94"
                METRICS_FILE="/metrics/nfs_health.prom"
                TIMESTAMP=$(date +%s)

                # Check NFS server connectivity (port 2049)
                NFS_SERVER_OK=0
                if timeout 5 nc -z "$NFS_SERVER" 2049 2>/dev/null; then
                  NFS_SERVER_OK=1
                fi

                # Check for stale mounts
                STALE_MOUNTS=0
                TOTAL_MOUNTS=0
                MOUNTS_HEALTHY=1
                # Store pod UIDs in a temp file instead of array
                STALE_PODS_FILE="/tmp/stale-pods-$$"
                rm -f "$STALE_PODS_FILE"

                # Find all NFS CSI mount points
                # IMPORTANT: Don't glob the 'mount' directory directly - bash glob skips
                # paths that return ESTALE (stale NFS file handle), causing silent failures.
                # Instead, iterate through parent directories (which are local) and
                # explicitly construct/check each mount path.
                for csi_vol_dir in /host/var/lib/kubelet/pods/*/volumes/kubernetes.io~csi/*; do
                  if [ -d "$csi_vol_dir" ]; then
                    mount_path="$csi_vol_dir/mount"
                    # Check if mount directory exists (local check on parent dir)
                    if [ -e "$mount_path" ] || ls "$csi_vol_dir" 2>/dev/null | grep -q "^mount$"; then
                      TOTAL_MOUNTS=$((TOTAL_MOUNTS + 1))
                      # Now try to stat the mount - this will fail on stale NFS
                      if ! timeout 5 stat "$mount_path" >/dev/null 2>&1; then
                        echo "ERROR: Stale mount detected: $mount_path"
                        STALE_MOUNTS=$((STALE_MOUNTS + 1))
                        MOUNTS_HEALTHY=0

                        # Extract pod UID from path and save to file
                        POD_UID=$(echo "$mount_path" | sed -n 's|.*/pods/\([^/]*\)/.*|\1|p')
                        if [ -n "$POD_UID" ]; then
                          echo "$POD_UID" >> "$STALE_PODS_FILE"
                        fi
                      fi
                    fi
                  fi
                done

                # Calculate overall health status
                HEALTH_STATUS=1
                if [ $NFS_SERVER_OK -eq 0 ] || [ $MOUNTS_HEALTHY -eq 0 ]; then
                  HEALTH_STATUS=0
                  echo "WARNING: NFS health degraded on node $(hostname)"

                  # Attempt recovery if stale mounts detected
                  if [ $MOUNTS_HEALTHY -eq 0 ]; then
                    echo "INFO: Initiating automatic recovery..."
                    TOTAL_RECOVERY_ATTEMPTS=$((TOTAL_RECOVERY_ATTEMPTS + 1))

                    # Step 1: Delete CSI driver pod on this node to force remount
                    NODE_NAME=$(hostname)
                    echo "INFO: Restarting CSI driver pod on node $NODE_NAME..."
                    if kubectl delete pod -n kube-system -l app=csi-nfs-node --field-selector spec.nodeName="$NODE_NAME" --grace-period=30 2>&1; then
                      echo "INFO: CSI driver pod deleted, waiting for restart..."
                      sleep 15

                      # Step 2: Delete affected pods (read from file)
                      if [ -f "$STALE_PODS_FILE" ]; then
                        while read pod_uid; do
                          echo "INFO: Looking for pod with UID $pod_uid..."
                          POD_INFO=$(kubectl get pods -A -o json | jq -r ".items[] | select(.metadata.uid==\"$pod_uid\") | \"\(.metadata.namespace)/\(.metadata.name)\"" 2>/dev/null)
                          if [ -n "$POD_INFO" ]; then
                            NAMESPACE=$(echo "$POD_INFO" | cut -d/ -f1)
                            POD_NAME=$(echo "$POD_INFO" | cut -d/ -f2)
                            echo "INFO: Deleting affected pod $NAMESPACE/$POD_NAME..."
                            if kubectl delete pod -n "$NAMESPACE" "$POD_NAME" --grace-period=30 2>&1; then
                              echo "INFO: Pod $NAMESPACE/$POD_NAME deleted successfully"
                            fi
                          fi
                        done < "$STALE_PODS_FILE"
                      fi

                      # Wait for recovery
                      sleep 10

                      # Re-check mounts (using same non-glob approach)
                      RECOVERY_SUCCESS=1
                      for csi_vol_dir in /host/var/lib/kubelet/pods/*/volumes/kubernetes.io~csi/*; do
                        if [ -d "$csi_vol_dir" ]; then
                          mount_path="$csi_vol_dir/mount"
                          if [ -e "$mount_path" ] || ls "$csi_vol_dir" 2>/dev/null | grep -q "^mount$"; then
                            if ! timeout 5 stat "$mount_path" >/dev/null 2>&1; then
                              RECOVERY_SUCCESS=0
                              break
                            fi
                          fi
                        fi
                      done

                      if [ $RECOVERY_SUCCESS -eq 1 ]; then
                        echo "INFO: Recovery successful - mounts are now healthy"
                        TOTAL_RECOVERY_SUCCESSES=$((TOTAL_RECOVERY_SUCCESSES + 1))
                        MOUNTS_HEALTHY=1
                        HEALTH_STATUS=1
                      else
                        echo "ERROR: Recovery failed - stale mounts still present"
                      fi
                    else
                      echo "ERROR: Failed to delete CSI driver pod"
                    fi

                    # Cleanup
                    rm -f "$STALE_PODS_FILE"
                  fi
                fi

                # Write metrics to textfile collector
                {
                  echo "# HELP nfs_health_status Overall NFS health status"
                  echo "# TYPE nfs_health_status gauge"
                  echo "nfs_health_status{type=\"overall\"} $HEALTH_STATUS"
                  echo ""
                  echo "# HELP nfs_server_reachable NFS server reachability"
                  echo "# TYPE nfs_server_reachable gauge"
                  echo "nfs_server_reachable{server=\"$NFS_SERVER\"} $NFS_SERVER_OK"
                  echo ""
                  echo "# HELP nfs_mounts_healthy NFS mounts health"
                  echo "# TYPE nfs_mounts_healthy gauge"
                  echo "nfs_mounts_healthy $MOUNTS_HEALTHY"
                  echo ""
                  echo "# HELP nfs_stale_mounts_detected_total Total stale mount detections"
                  echo "# TYPE nfs_stale_mounts_detected_total counter"
                  echo "nfs_stale_mounts_detected_total $STALE_MOUNTS"
                  echo ""
                  echo "# HELP nfs_total_mounts Total NFS mounts"
                  echo "# TYPE nfs_total_mounts gauge"
                  echo "nfs_total_mounts $TOTAL_MOUNTS"
                  echo ""
                  echo "# HELP nfs_monitor_last_run_timestamp_seconds Last health check timestamp"
                  echo "# TYPE nfs_monitor_last_run_timestamp_seconds gauge"
                  echo "nfs_monitor_last_run_timestamp_seconds $TIMESTAMP"
                  echo ""
                  echo "# HELP nfs_recovery_attempts_total Total recovery attempts"
                  echo "# TYPE nfs_recovery_attempts_total counter"
                  echo "nfs_recovery_attempts_total $TOTAL_RECOVERY_ATTEMPTS"
                  echo ""
                  echo "# HELP nfs_recovery_successes_total Total successful recoveries"
                  echo "# TYPE nfs_recovery_successes_total counter"
                  echo "nfs_recovery_successes_total $TOTAL_RECOVERY_SUCCESSES"
                } > "$METRICS_FILE.$$"

                # Atomic move
                mv "$METRICS_FILE.$$" "$METRICS_FILE" 2>/dev/null || true
                echo "Metrics written to $METRICS_FILE"

                # Sleep for 1 minute
                sleep 60
              done
          volumeMounts:
            - name: kubelet-dir
              mountPath: /host/var/lib/kubelet
              mountPropagation: HostToContainer
            - name: textfile-collector
              mountPath: /metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            privileged: true
      volumes:
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: textfile-collector
          hostPath:
            path: /var/lib/node_exporter/textfile_collector
            type: DirectoryOrCreate
---
# ServiceMonitor for Prometheus integration (if using node-exporter textfile collector)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-monitor-scripts
  namespace: kube-system
data:
  monitor-nfs.sh: |
    #!/bin/bash
    # This script is mounted into the node-exporter pods for textfile metrics collection

    METRICS_FILE="/metrics/nfs_health.prom"
    TIMESTAMP=$(date +%s)

    # Check NFS server connectivity
    NFS_SERVER="192.168.1.94"
    NFS_SERVER_OK=0
    if timeout 5 bash -c "echo >/dev/tcp/$NFS_SERVER/2049" 2>/dev/null; then
      NFS_SERVER_OK=1
    fi

    # Check for stale mounts
    # IMPORTANT: Don't use find or glob on the mount directory - they skip ESTALE paths.
    # Instead, iterate through parent directories and explicitly check each mount.
    STALE_MOUNTS=0
    TOTAL_MOUNTS=0

    for csi_vol_dir in /var/lib/kubelet/pods/*/volumes/kubernetes.io~csi/*; do
      if [ -d "$csi_vol_dir" ]; then
        mount_path="$csi_vol_dir/mount"
        if [ -e "$mount_path" ] || ls "$csi_vol_dir" 2>/dev/null | grep -q "^mount$"; then
          TOTAL_MOUNTS=$((TOTAL_MOUNTS + 1))
          if ! timeout 5 stat "$mount_path" >/dev/null 2>&1; then
            STALE_MOUNTS=$((STALE_MOUNTS + 1))
          fi
        fi
      fi
    done

    # Calculate health status
    HEALTH_STATUS=1
    if [ $NFS_SERVER_OK -eq 0 ] || [ $STALE_MOUNTS -gt 0 ]; then
      HEALTH_STATUS=0
    fi

    # Export metrics
    cat > "$METRICS_FILE.$$" <<EOF
# HELP nfs_health_status Overall NFS health status (1=healthy, 0=degraded)
# TYPE nfs_health_status gauge
nfs_health_status{type="overall"} $HEALTH_STATUS

# HELP nfs_server_reachable NFS server reachability (1=ok, 0=down)
# TYPE nfs_server_reachable gauge
nfs_server_reachable{server="$NFS_SERVER"} $NFS_SERVER_OK

# HELP nfs_stale_mounts Number of stale NFS mounts detected
# TYPE nfs_stale_mounts gauge
nfs_stale_mounts $STALE_MOUNTS

# HELP nfs_total_mounts Total number of NFS mounts
# TYPE nfs_total_mounts gauge
nfs_total_mounts $TOTAL_MOUNTS

# HELP nfs_monitor_last_run_timestamp_seconds Last NFS health check timestamp
# TYPE nfs_monitor_last_run_timestamp_seconds gauge
nfs_monitor_last_run_timestamp_seconds $TIMESTAMP
EOF

    mv "$METRICS_FILE.$$" "$METRICS_FILE"
