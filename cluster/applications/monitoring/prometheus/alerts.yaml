---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
    - name: cluster_health
      interval: 30s
      rules:
      # Node alerts
      - alert: NodeDown
        expr: up{job="kubernetes-nodes"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "Node {{ $labels.instance }} has been down for more than 5 minutes."

      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is not ready"
          description: "Node {{ $labels.node }} has been in NotReady state for more than 5 minutes."

      - alert: NodeHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage on {{ $labels.instance }} is {{ $value | humanize }}% for more than 10 minutes."

      - alert: NodeHighMemory
        expr: 100 * (1 - ((node_memory_MemAvailable_bytes) / (node_memory_MemTotal_bytes))) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage on {{ $labels.instance }} is {{ $value | humanize }}% for more than 10 minutes."

      - alert: NodeDiskSpaceLow
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"}) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk usage on {{ $labels.instance }} is {{ $value | humanize }}% for more than 10 minutes."

      - alert: NodeDiskSpaceCritical
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"}) > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk usage on {{ $labels.instance }} is {{ $value | humanize }}%. Immediate action required!"

      # Pod alerts
      - alert: PodOOMKilled
        expr: |
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          and
          (time() - kube_pod_container_state_started) < 600
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
          description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was killed due to out of memory in the last 10 minutes. Consider increasing memory limits."

      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been restarting frequently ({{ $value | humanize }} restarts/sec)."

      - alert: PodFrequentRestarts
        expr: increase(kube_pod_container_status_restarts_total[6h]) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting frequently"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value }} times in the last 6 hours. May indicate memory leak or resource exhaustion."

      - alert: PodNotReady
        expr: kube_pod_status_phase{phase!~"Running|Succeeded"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in {{ $labels.phase }} state for more than 15 minutes."

      # Persistent Volume alerts
      - alert: PersistentVolumeFillingUp
        expr: 100 - ((kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PersistentVolume {{ $labels.persistentvolumeclaim }} is filling up"
          description: "PersistentVolume {{ $labels.persistentvolumeclaim }} is {{ $value | humanize }}% full."

      # etcd alerts (for K3s with etcd)
      - alert: EtcdHighNumberOfFailedGRPCRequests
        expr: sum(rate(grpc_server_handled_total{grpc_code!="OK",job="kubernetes-apiservers"}[5m])) BY (grpc_service, grpc_method) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High number of failed gRPC requests"
          description: "{{ $value }}% of requests for {{ $labels.grpc_method }} failed on {{ $labels.grpc_service }}."

      # API server alerts
      - alert: KubernetesAPIServerDown
        expr: up{job="kubernetes-apiservers"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes API server is down"
          description: "Kubernetes API server has been down for more than 5 minutes."

      # General cluster alerts
      - alert: TooManyPods
        expr: count(kube_pod_info) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High number of pods in cluster"
          description: "Cluster is running {{ $value }} pods. Consider reviewing workload distribution."

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus has been down for more than 5 minutes."

    - name: system_monitoring
      interval: 30s
      rules:
      # Disk monitoring alerts
      - alert: DiskMonitorFailed
        expr: disk_monitor_status{type="overall"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Disk monitoring detected failure on {{ $labels.instance }}"
          description: "Drive failure detected. Storage array may be locked down read-only."

      - alert: DiskMonitorStale
        expr: time() - disk_monitor_last_run_timestamp_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk monitor hasn't run recently on {{ $labels.instance }}"
          description: "Last run was {{ $value | humanizeDuration }} ago. Expected every 5 minutes."

      - alert: DiskSmartFailure
        expr: disk_smart_health == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SMART health failure on {{ $labels.device }}"
          description: "{{ $labels.type }} drive {{ $labels.device }} has failed SMART health checks on {{ $labels.instance }}."

      - alert: DiskMountFailed
        expr: disk_mount_accessible == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Mount point {{ $labels.mount }} not accessible"
          description: "Mount point {{ $labels.mount }} is not accessible on {{ $labels.instance }}."

      - alert: MergerFSDown
        expr: disk_mergerfs_status == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MergerFS pool down on {{ $labels.instance }}"
          description: "MergerFS mount {{ $labels.mount }} is not accessible on {{ $labels.instance }}."

      # SnapRAID alerts
      - alert: SnapRAIDFailed
        expr: snapraid_last_run_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SnapRAID sync failed on {{ $labels.instance }}"
          description: "Last SnapRAID sync failed on {{ $labels.instance }}. Check /var/log/snapraid.log"

      - alert: SnapRAIDStale
        expr: time() - snapraid_last_run_timestamp_seconds > 172800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SnapRAID hasn't run in 2 days on {{ $labels.instance }}"
          description: "Last SnapRAID sync was {{ $value | humanizeDuration }} ago. Expected daily."

      # Borgmatic backup alerts
      - alert: BorgmaticBackupFailed
        expr: borgmatic_last_run_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Borgmatic backup failed on {{ $labels.instance }}"
          description: "Last Borgmatic backup failed on {{ $labels.instance }}. Check logs with: journalctl -u borgmatic.service"

      - alert: BorgmaticBackupStale
        expr: time() - borgmatic_last_run_timestamp_seconds > 172800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No backup in 2 days on {{ $labels.instance }}"
          description: "Last Borgmatic backup was {{ $value | humanizeDuration }} ago. Expected daily."

    - name: external_services
      interval: 30s
      rules:
      # Service availability
      - alert: ServiceDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been unreachable for more than 2 minutes. HTTP probe failed."

      - alert: ServiceDegraded
        expr: probe_http_status_code{job="blackbox-http"} >= 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.instance }} returning errors"
          description: "{{ $labels.instance }} is returning HTTP {{ $value }} for more than 2 minutes."

      # Certificate expiration
      - alert: SSLCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate for {{ $labels.instance }} expires soon"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanize }} days. Renewal should happen automatically."

      - alert: SSLCertificateExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) / 86400 < 7
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "SSL certificate for {{ $labels.instance }} expires in 7 days!"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanize }} days. URGENT: Check Let's Encrypt renewal!"

      - alert: SSLCertificateInvalid
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SSL certificate invalid for {{ $labels.instance }}"
          description: "{{ $labels.instance }} has an invalid SSL certificate or SSL handshake failed."

      # Slow response time
      - alert: ServiceSlowResponse
        expr: probe_duration_seconds{job="blackbox-http"} > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response from {{ $labels.instance }}"
          description: "{{ $labels.instance }} is responding slowly ({{ $value | humanize }}s). May indicate performance issues."
