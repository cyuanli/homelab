---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: system-monitoring-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
  - name: system_monitoring
    interval: 30s
    rules:
    - alert: DiskMonitorFailed
      expr: disk_monitor_status{type="overall"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Disk monitoring detected failure on {{ $labels.instance }}"
        description: "Drive failure detected. Storage array may be locked down read-only."

    - alert: DiskMonitorStale
      expr: time() - disk_monitor_last_run_timestamp_seconds > 600
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Disk monitor hasn't run recently on {{ $labels.instance }}"
        description: "Last run was {{ $value | humanizeDuration }} ago. Expected every 5 minutes."

    - alert: DiskSmartFailure
      expr: disk_smart_health == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "SMART health failure on {{ $labels.device }}"
        description: "{{ $labels.type }} drive {{ $labels.device }} has failed SMART health checks on {{ $labels.instance }}."

    # raw attributes, not the -H verdict. -H said PASSED at 88 pending sectors
    - alert: DiskPendingSectors
      expr: smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"} > 0
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: "{{ $value }} pending sectors on {{ $labels.device }} ({{ $labels.instance }})"
        description: "Sectors failed to read and await reallocation. This is the signal that preceded the WD50NDZW failure. Check: sudo smartctl -x /dev/{{ $labels.device }}"

    # growth, not absolute. sde sits at 1 reallocated, normal aging
    - alert: DiskReallocatedSectorsGrowing
      expr: increase(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"}[24h]) > 0
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: "Reallocated sectors rising on {{ $labels.device }} ({{ $labels.instance }})"
        description: "Grew by {{ $value }} in 24h. The drive is consuming spare sectors. Replace it."

    # cabling faults, not media
    - alert: DiskCRCErrorsGrowing
      expr: increase(smartctl_device_attribute{attribute_name="UDMA_CRC_Error_Count",attribute_value_type="raw"}[1h]) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Link CRC errors rising on {{ $labels.device }} ({{ $labels.instance }})"
        description: "Grew by {{ $value }} in 1h. Reseat the SATA/USB cable before suspecting the drive."

    # spinners only. join excludes SSDs, which run hotter by design
    - alert: DiskTemperatureHigh
      expr: smartctl_device_temperature{temperature_type="current"} > 52 and on(instance, device) smartctl_device_rotation_rate > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.device }} at {{ $value }}C on {{ $labels.instance }}"
        description: "Sustained heat is what killed the last backup drive. Check airflow and enclosure ventilation."

    - alert: DiskTemperatureCritical
      expr: smartctl_device_temperature{temperature_type="current"} > 58 and on(instance, device) smartctl_device_rotation_rate > 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "{{ $labels.device }} at {{ $value }}C on {{ $labels.instance }}"
        description: "Above the safe range for a spinning drive. Improve cooling or power it down."

    - alert: SmartExporterDown
      expr: up{job=~".*smartctl.*"} == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "smartctl-exporter not scraping on {{ $labels.instance }}"
        description: "All drive health alerts on this node are blind while this is down."

    - alert: DiskMountFailed
      expr: disk_mount_accessible == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Mount point {{ $labels.mount }} not accessible"
        description: "Mount point {{ $labels.mount }} is not accessible on {{ $labels.instance }}."

    - alert: MergerFSDown
      expr: disk_mergerfs_status == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "MergerFS pool down on {{ $labels.instance }}"
        description: "MergerFS mount {{ $labels.mount }} is not accessible on {{ $labels.instance }}."

    # Server-side NFS, from monitor-storage.sh. Covers the failure class that
    # cascaded the cluster on 2026-08-21.
    - alert: NFSExportDegraded
      expr: nfs_export_status{type="overall"} == 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "NFS export layer degraded on {{ $labels.instance }}"
        description: "monitor-storage.sh reports the NFS export layer is degraded on {{ $labels.instance }}. See the NFSServerDown / NFSExportBindStale / NFSExportMissing alerts for the specific cause. Not a drive failure - workloads are NOT locked down."

    - alert: NFSServerDown
      expr: nfs_server_active == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "NFS server not running on {{ $labels.instance }}"
        description: "{{ $labels.unit }} is not active on {{ $labels.instance }} - all cluster NFS mounts will go stale. Start it with: sudo systemctl start nfs-server.service"

    - alert: NFSExportBindStale
      expr: nfs_export_bind_accessible == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "NFS export bind {{ $labels.mount }} stale/missing"
        description: "Export bind {{ $labels.mount }} is not mounted or not readable on {{ $labels.instance }} (stale bind or ENOTCONN pool). Clients will get stale file handles. Check the mergerfs pool and rebind, then run: sudo exportfs -ra"

    - alert: NFSExportMissing
      expr: nfs_export_fsid_present == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "NFS export fsid={{ $labels.fsid }} missing from nfsd table"
        description: "nfsd is not exporting fsid={{ $labels.fsid }} on {{ $labels.instance }} - clients cannot mount it even though the bind may look fine locally. Refresh with: sudo exportfs -ra"

    - alert: NFSExportCheckStale
      expr: time() - nfs_export_last_run_timestamp_seconds > 600
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "NFS export health check hasn't run recently on {{ $labels.instance }}"
        description: "Last NFS export check was {{ $value | humanizeDuration }} ago. Expected every 5 minutes (disk-monitor.timer)."

    - alert: SnapRAIDFailed
      expr: snapraid_last_run_status == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "SnapRAID sync failed on {{ $labels.instance }}"
        description: "Last SnapRAID sync failed on {{ $labels.instance }}. Check /var/log/snapraid.log"

    - alert: SnapRAIDStale
      expr: time() - snapraid_last_run_timestamp_seconds > 172800
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "SnapRAID hasn't run in 2 days on {{ $labels.instance }}"
        description: "Last SnapRAID sync was {{ $value | humanizeDuration }} ago. Expected daily."

    - alert: BorgmaticBackupFailed
      expr: borgmatic_last_run_status == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Borgmatic backup failed on {{ $labels.instance }}"
        description: "Last Borgmatic backup failed on {{ $labels.instance }}. Check logs with: journalctl -u borgmatic.service"

    - alert: BorgmaticBackupStale
      expr: time() - borgmatic_last_run_timestamp_seconds > 172800
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "No backup in 2 days on {{ $labels.instance }}"
        description: "Last Borgmatic backup was {{ $value | humanizeDuration }} ago. Expected daily."

    - alert: BackupDiskFillingUp
      expr: node_filesystem_avail_bytes{mountpoint="/media/archive"} / node_filesystem_size_bytes{mountpoint="/media/archive"} < 0.15
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Backup disk {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} free on {{ $labels.instance }}"
        description: "Trim keep_monthly in borgmatic config or reclaim space from the SMB share before backups start failing."

    # only dump-failure signal. backup-databases.sh exits 0 by design
    - alert: DatabaseDumpFailed
      expr: homelab_db_dump_success == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Database dump failed for {{ $labels.database }}"
        description: "Could not dump the {{ $labels.database }} database on {{ $labels.instance }}. The previous dump was kept, so the backup contains a STALE copy of this database. Check: journalctl -u borgmatic.service"

    # 2 days, not 1: dumps run nightly, but two misses mean the archived dump
    # no longer matches the file trees beside it.
    - alert: DatabaseDumpStale
      expr: time() - homelab_db_dump_timestamp_seconds > 172800
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: "Database dump for {{ $labels.database }} is stale"
        description: "Newest dump of {{ $labels.database }} on {{ $labels.instance }} is {{ $value | humanizeDuration }} old. Expected daily. Restoring now would roll this database back by that much."

    # Both DBs are hundreds of MB. A tiny dump means pg_dump succeeded against
    # an empty or half-initialised database and overwrote the good one.
    - alert: DatabaseDumpSuspiciouslySmall
      expr: homelab_db_dump_size_bytes < 1048576
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Database dump for {{ $labels.database }} is suspiciously small"
        description: "Dump of {{ $labels.database }} on {{ $labels.instance }} is only {{ $value | humanize1024 }}B. Expected hundreds of MB. The database may be empty or the dump may be incomplete - verify before relying on this backup."
