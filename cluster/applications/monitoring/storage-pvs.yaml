---
# Grafana NFS Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data-nfs
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-media
  mountOptions:
    - vers=4.1
    - hard
    - timeo=300
    - retrans=3
    - rsize=1048576
    - wsize=1048576
    - _netdev
    - noresvport
    - noatime
    - actimeo=30
    - lookupcache=positive
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: grafana-data-nfs
    volumeAttributes:
      server: 192.168.1.94
      share: /configs/monitoring/grafana-data

