# Absent in K3s.
defaultRules:
  disabled:
    Watchdog: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-prometheus-auth@kubernetescrd
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - prometheus.cliff.li
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: kube-prometheus-stack-prometheus-tls
        hosts:
          - prometheus.cliff.li

  prometheusSpec:
    externalUrl: https://prometheus.cliff.li

    externalLabels:
      cluster: 'homelab'

    retention: 30d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-direct
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # NFS I/O stalls during TSDB compaction make Prometheus briefly
    # unresponsive. The 30s default kills it mid-compaction.
    containers:
      - name: prometheus
        livenessProbe:
          failureThreshold: 18
          periodSeconds: 5
          timeoutSeconds: 3

    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    additionalScrapeConfigs:
      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - https://alertmanager.cliff.li
            - https://drive.cliff.li
            - https://grafana.cliff.li
            - https://photos.cliff.li
            - https://jellyfin.cliff.li
            - https://owntracks.cliff.li
            - https://prometheus.cliff.li
            - https://prowlarr.cliff.li
            - https://qbittorrent.cliff.li
            - https://radarr.cliff.li
            - https://sonarr.cliff.li
            - https://traefik.cliff.li/ping
            - https://whoami.cliff.li
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: prometheus-blackbox-exporter:9115

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-prometheus-auth@kubernetescrd
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - alertmanager.cliff.li
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.cliff.li

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'discord'
      routes:
      - match:
          alertname: InfoInhibitor
        receiver: 'null'
      - match:
          severity: critical
        receiver: discord
        continue: true
      - match:
          severity: warning
        receiver: discord
        continue: true

    receivers:
    - name: 'null'
    - name: 'discord'
      webhook_configs:
      - url: 'http://alertmanager-discord:9094'
        send_resolved: true

  alertmanagerSpec:
    externalUrl: https://alertmanager.cliff.li

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

grafana:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - grafana.cliff.li
    path: /
    pathType: Prefix
    tls:
      - secretName: kube-prometheus-stack-grafana-tls
        hosts:
          - grafana.cliff.li

  persistence:
    enabled: true
    storageClassName: nfs-direct
    existingClaim: grafana-data-nfs
    size: 10Gi

  securityContext:
    fsGroup: 472
    runAsUser: 472

  # Unneeded given the securityContext above.
  initChownData:
    enabled: false

  env:
    GF_INSTALL_PLUGINS: "grafana-clock-panel"
    GF_SERVER_ROOT_URL: "https://grafana.cliff.li"
    GF_AUTH_ANONYMOUS_ENABLED: "false"

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # No CPU limit, node-exporter must burst during scrapes.
      memory: 128Mi

  # WITHOUT THIS BLOCK EVERY SCRIPT-EXPORTED METRIC IS SILENTLY LOST, and every
  # alert built on one evaluates against no data and can never fire. The
  # collector is on by default but reads nothing unless the flag is set AND the
  # host directory is mounted in. Verify after any change, expect one series per
  # .prom file:
  #   kubectl -n monitoring exec ds/kube-prometheus-stack-prometheus-node-exporter \
  #     -- wget -qO- localhost:9100/metrics | grep node_textfile_mtime_seconds
  extraArgs:
    - --collector.textfile.directory=/host/textfile_collector
  extraHostVolumeMounts:
    - name: textfile-collector
      hostPath: /var/lib/node_exporter/textfile_collector
      mountPath: /host/textfile_collector
      # Not Directory: only storage and monitoring nodes run the exporting
      # scripts, elsewhere the pod would hang in ContainerCreating.
      type: DirectoryOrCreate
      readOnly: true
  prometheus:
    monitor:
      attachMetadata:
        node: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: instance
          replacement: $1
          action: replace
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: node
          replacement: $1
          action: replace

kubeStateMetrics: {}

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubelet:
  serviceMonitor:
    attachMetadata:
      node: true
    relabelings:
      - sourceLabels: [__meta_kubernetes_endpoint_address_target_name]
        targetLabel: instance
        action: replace
      - sourceLabels: [__meta_kubernetes_endpoint_address_target_name]
        targetLabel: node
        action: replace
      # KubeletDown alert matches on metrics_path.
      - sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
        action: replace

# Absent in K3s.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false
