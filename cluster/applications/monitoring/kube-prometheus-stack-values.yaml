# kube-prometheus-stack Helm values
# Migrated from manual YAML manifests to align with industry standards

# Disable K3s components that don't exist
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

# Prometheus configuration
prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      traefik.ingress.kubernetes.io/redirect-entry-point: websecure
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-prometheus-auth@kubernetescrd
    hosts:
      - prometheus.cliff.li
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.cliff.li

  prometheusSpec:
    # External URL
    externalUrl: https://prometheus.cliff.li

    # External labels
    externalLabels:
      cluster: 'homelab'

    # Retention
    retention: 30d

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Resources
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

    # Service monitor selectors - discover all ServiceMonitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Additional scrape configs for custom targets
    additionalScrapeConfigs:
      # Blackbox Exporter - External endpoint monitoring
      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - https://alertmanager.cliff.li
            - https://drive.cliff.li
            - https://grafana.cliff.li
            - https://photos.cliff.li
            - https://jellyfin.cliff.li
            - https://owntracks.cliff.li
            - https://prometheus.cliff.li
            - https://prowlarr.cliff.li
            - https://qbittorrent.cliff.li
            - https://radarr.cliff.li
            - https://sonarr.cliff.li
            - https://traefik.cliff.li
            - https://whoami.cliff.li
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: prometheus-blackbox-exporter:9115

# Alertmanager configuration
alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      traefik.ingress.kubernetes.io/redirect-entry-point: websecure
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-prometheus-auth@kubernetescrd
    hosts:
      - alertmanager.cliff.li
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.cliff.li

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'discord'
      routes:
      - match:
          severity: critical
        receiver: discord
        continue: true
      - match:
          severity: warning
        receiver: discord
        continue: true

    receivers:
    - name: 'discord'
      webhook_configs:
      - url: 'http://alertmanager-discord:9094'
        send_resolved: true

  alertmanagerSpec:
    externalUrl: https://alertmanager.cliff.li

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Grafana configuration
grafana:
  # Password will be auto-generated by Helm and stored in a Kubernetes secret
  # Retrieve it with: kubectl get secret -n monitoring kube-prometheus-stack-grafana -o jsonpath="{.data.admin-password}" | base64 --decode

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    hosts:
      - grafana.cliff.li
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.cliff.li

  # Persistence
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi

  # Security context
  securityContext:
    fsGroup: 472
    runAsUser: 472

  # Disable init container - not needed with proper securityContext
  initChownData:
    enabled: false

  env:
    GF_INSTALL_PLUGINS: "grafana-clock-panel"
    GF_SERVER_ROOT_URL: "https://grafana.cliff.li"
    GF_AUTH_ANONYMOUS_ENABLED: "false"

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Node Exporter configuration
prometheus-node-exporter:
  prometheus:
    monitor:
      # Attach node metadata to enable hostname labeling
      attachMetadata:
        node: true
      # Relabel configs to use node name as instance
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: instance
          replacement: $1
          action: replace
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: node
          replacement: $1
          action: replace

# Kube-State-Metrics configuration
kubeStateMetrics: {}

# Prometheus Operator configuration
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Disable components not used in K3s
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false
