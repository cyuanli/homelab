# kube-prometheus-stack Helm values
# Migrated from manual YAML manifests to align with industry standards

# Disable K3s components that don't exist
defaultRules:
  disabled:
    Watchdog: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

# Prometheus configuration
prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-prometheus-auth@kubernetescrd
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - prometheus.cliff.li
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: kube-prometheus-stack-prometheus-tls
        hosts:
          - prometheus.cliff.li

  prometheusSpec:
    # External URL
    externalUrl: https://prometheus.cliff.li

    # External labels
    externalLabels:
      cluster: 'homelab'

    # Retention
    retention: 30d

    # Storage - using NFS storage class
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-direct
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Relax liveness probe for NFS-backed storage
    # NFS I/O stalls during TSDB compaction can make Prometheus briefly unresponsive.
    # Default (30s) is too aggressive; 90s gives compactions time to finish.
    containers:
      - name: prometheus
        livenessProbe:
          failureThreshold: 18
          periodSeconds: 5
          timeoutSeconds: 3

    # Resources
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

    # Service monitor selectors - discover all ServiceMonitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Additional scrape configs for custom targets
    additionalScrapeConfigs:
      # Blackbox Exporter - External endpoint monitoring
      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - https://alertmanager.cliff.li
            - https://drive.cliff.li
            - https://grafana.cliff.li
            - https://photos.cliff.li
            - https://jellyfin.cliff.li
            - https://owntracks.cliff.li
            - https://prometheus.cliff.li
            - https://prowlarr.cliff.li
            - https://qbittorrent.cliff.li
            - https://radarr.cliff.li
            - https://sonarr.cliff.li
            - https://traefik.cliff.li/ping
            - https://whoami.cliff.li
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: prometheus-blackbox-exporter:9115

# Alertmanager configuration
alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-prometheus-auth@kubernetescrd
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - alertmanager.cliff.li
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.cliff.li

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'discord'
      routes:
      - match:
          alertname: InfoInhibitor
        receiver: 'null'
      - match:
          severity: critical
        receiver: discord
        continue: true
      - match:
          severity: warning
        receiver: discord
        continue: true

    receivers:
    - name: 'null'
    - name: 'discord'
      webhook_configs:
      - url: 'http://alertmanager-discord:9094'
        send_resolved: true

  alertmanagerSpec:
    externalUrl: https://alertmanager.cliff.li

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Grafana configuration
grafana:
  # Password will be auto-generated by Helm and stored in a Kubernetes secret
  # Retrieve it with: kubectl get secret -n monitoring kube-prometheus-stack-grafana -o jsonpath="{.data.admin-password}" | base64 --decode

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - grafana.cliff.li
    path: /
    pathType: Prefix
    tls:
      - secretName: kube-prometheus-stack-grafana-tls
        hosts:
          - grafana.cliff.li

  # Persistence - using existing NFS PVC
  persistence:
    enabled: true
    storageClassName: nfs-direct
    existingClaim: grafana-data-nfs
    size: 10Gi

  # Security context
  securityContext:
    fsGroup: 472
    runAsUser: 472

  # Disable init container - not needed with proper securityContext
  initChownData:
    enabled: false

  env:
    GF_INSTALL_PLUGINS: "grafana-clock-panel"
    GF_SERVER_ROOT_URL: "https://grafana.cliff.li"
    GF_AUTH_ANONYMOUS_ENABLED: "false"

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Node Exporter configuration
prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # No CPU limit - allow bursting during scrapes
      memory: 128Mi

  # ---------------------------------------------------------------------------
  # Textfile collector. WITHOUT THIS BLOCK EVERY SCRIPT-EXPORTED METRIC IS LOST.
  #
  # node_exporter enables the textfile collector by default, but it reads
  # nothing unless --collector.textfile.directory is set, and the host directory
  # has to be mounted into the container. Neither was configured until
  # 2026-08-22, so nothing any script wrote to
  # /var/lib/node_exporter/textfile_collector had ever reached Prometheus:
  # disk_monitor_*, nfs_export_*, snapraid_*, borgmatic_* and homelab_db_dump_*
  # were all absent. Every alert built on them silently evaluated against no
  # data and could never fire - drive failure, SnapRAID, NFS export and backup
  # alerting were all inert.
  #
  # Verify after any change to this block (expect one series per .prom file):
  #   kubectl -n monitoring exec ds/kube-prometheus-stack-prometheus-node-exporter \
  #     -- wget -qO- localhost:9100/metrics | grep node_textfile_mtime_seconds
  extraArgs:
    - --collector.textfile.directory=/host/textfile_collector
  extraHostVolumeMounts:
    - name: textfile-collector
      hostPath: /var/lib/node_exporter/textfile_collector
      mountPath: /host/textfile_collector
      # DirectoryOrCreate, not Directory: only the storage and monitoring nodes
      # actually run the exporting scripts, and a plain Directory would leave the
      # DaemonSet pod stuck ContainerCreating on every other node.
      type: DirectoryOrCreate
      readOnly: true
  prometheus:
    monitor:
      # Attach node metadata to enable hostname labeling
      attachMetadata:
        node: true
      # Relabel configs to use node name as instance
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: instance
          replacement: $1
          action: replace
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: node
          replacement: $1
          action: replace

# Kube-State-Metrics configuration
kubeStateMetrics: {}

# kube-state-metrics subchart configuration
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Prometheus Operator configuration
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Kubelet configuration - add relabeling to use hostname instead of IP
kubelet:
  serviceMonitor:
    # Attach node metadata to enable hostname labeling
    attachMetadata:
      node: true
    # Relabel configs to use node name as instance (applied to all endpoints)
    relabelings:
      - sourceLabels: [__meta_kubernetes_endpoint_address_target_name]
        targetLabel: instance
        action: replace
      - sourceLabels: [__meta_kubernetes_endpoint_address_target_name]
        targetLabel: node
        action: replace
      # Preserve metrics_path label (required for KubeletDown alert rule)
      - sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
        action: replace

# Disable components not used in K3s
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false
