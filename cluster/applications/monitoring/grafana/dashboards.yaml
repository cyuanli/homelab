          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value #A": true,
                  "__name__": true,
                  "container": true,
                  "created_by_kind": true,
                  "created_by_name": true,
                  "host_ip": true,
                  "host_network": true,
                  "instance": true,
                  "job": true,
                  "pod_ip": true,
                  "priority_class": true,
                  "uid": true
                },
                "indexByName": {
                  "namespace": 0,
                  "pod": 1,
                  "node": 2,
                  "phase": 3,
                  "Value #B": 4
                },
                "renameByName": {
                  "Value #B": "Restarts",
                  "namespace": "Namespace",
                  "node": "Node",
                  "phase": "Status",
                  "pod": "Pod"
                }
              }
            }
          ],
          "type": "table"
        }
