apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - secrets.yaml
  - hermes.yaml

namespace: ai

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: homelab
