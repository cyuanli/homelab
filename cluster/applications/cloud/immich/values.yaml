# Immich Helm Chart Values
# Using official chart from immich-app/immich-charts

replicaCount: 2

# Global environment variables for all components
controllers:
  main:
    containers:
      main:
        image:
          tag: v2.3.1
        env:
          # Database configuration
          DB_HOSTNAME: immich-postgres
          DB_PORT: "5432"
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-secrets
                key: db-password
          # Redis configuration
          REDIS_HOSTNAME: immich-redis
          REDIS_PORT: "6379"
          # Enable machine learning for facial recognition and object detection
          IMMICH_MACHINE_LEARNING_ENABLED: "true"

immich:
  persistence:
    library:
      existingClaim: immich-library

server:
  enabled: true
  image:
    repository: ghcr.io/immich-app/immich-server
    pullPolicy: IfNotPresent
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi

  # Additional persistence for cache data on SSD
  persistence:
    thumbs:
      enabled: true
      existingClaim: immich-thumbs
      globalMounts:
        - path: /data/thumbs
    encoded-video:
      enabled: true
      existingClaim: immich-encoded-video
      globalMounts:
        - path: /data/encoded-video
    profile:
      enabled: true
      existingClaim: immich-profile
      globalMounts:
        - path: /data/profile

  ingress:
    main:
      enabled: false  # We'll create a separate Ingress resource

machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
  persistence:
    cache:
      enabled: true
      size: 10Gi
      # Using emptyDir for cache (will be recreated on pod restart)
      # Change to persistentVolumeClaim if you want to persist the cache
      type: emptyDir

# Disable embedded Valkey (we're using external Redis)
valkey:
  enabled: false

# Note: PostgreSQL and Redis subcharts have been removed from the Immich chart
# We're using external PostgreSQL and Redis instances configured via env vars above
