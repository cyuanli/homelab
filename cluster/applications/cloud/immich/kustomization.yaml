apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloud

resources:
  - secrets.yaml
  - postgres.yaml
  - redis.yaml
  - storage-pvs.yaml
  - storage-pvcs.yaml
  - middleware.yaml
  - ingress.yaml

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: cloud
    app.kubernetes.io/part-of: homelab
