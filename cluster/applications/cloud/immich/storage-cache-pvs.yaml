---
# Immich thumbnails on SSD (/srv/app-storage)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-thumbs
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-direct
  mountOptions:
    - vers=4.1
    - hard
    - timeo=300
    - retrans=3
    - rsize=1048576
    - wsize=1048576
    - _netdev
    - noatime
    - actimeo=30
    - lookupcache=positive
  nfs:
    server: 192.168.1.94
    path: /configs/immich/thumbs

