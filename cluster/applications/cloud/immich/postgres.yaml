apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: cloud
  labels:
    app: immich-postgres
    component: database
spec:
  serviceName: immich-postgres
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
      - name: postgres
        image: tensorchord/pgvecto-rs:pg16-v0.2.0
        env:
        - name: POSTGRES_DB
          value: immich
        - name: POSTGRES_USER
          value: immich
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-postgres-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U immich -d immich
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U immich -d immich
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
  volumeClaimTemplates:
  # local-path, NOT nfs-direct. Immich's requirements are explicit that the
  # Postgres data directory "should ideally use local SSD storage, and never a
  # network share of any kind" - Postgres assumes fsync durability and POSIX
  # locking semantics that NFS does not reliably provide, and the failure mode
  # is silent corruption after a network blip rather than an error at startup.
  # https://docs.immich.app/install/requirements/
  #
  # This is why the database is the one Immich volume not on the NAS while the
  # library, thumbs, profile and encoded-video PVCs all use nfs-direct.
  #
  # Consequence: the PV is pinned by nodeAffinity to whichever node first bound
  # it (currently cyl-aspiree17) and cannot reschedule elsewhere, so Immich is
  # down whenever that node is. That is the accepted trade against corruption.
  # It also makes scripts/backup-databases.sh load-bearing: the PV's reclaim
  # policy is Delete, so this database exists in exactly one place plus the
  # nightly dump.
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: cloud
  labels:
    app: immich-postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    app: immich-postgres
