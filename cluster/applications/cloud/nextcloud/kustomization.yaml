apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloud

resources:
  - namespace.yaml
  - secrets.yaml
  - postgres.yaml
  - redis.yaml
  - storage-pvs.yaml
  - storage-pvcs.yaml
  - nextcloud.yaml
  - ingress.yaml

labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: cloud
    app.kubernetes.io/part-of: homelab

images:
  - name: nextcloud
    newTag: 32-apache
  - name: postgres
    newTag: 16-alpine
  - name: redis
    newTag: 7-alpine