  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-direct
  mountOptions:
    - vers=4.1
    - hard
    - timeo=300
    - retrans=3
    - rsize=1048576
    - wsize=1048576
    - _netdev
    - noatime
    - actimeo=30
    - lookupcache=positive
  nfs:
    server: 192.168.1.94
    path: /configs/syncthing/config

---
# PVC for Syncthing config
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-config
  namespace: utilities
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-direct
  volumeName: syncthing-config
  resources:
    requests:
      storage: 1Gi
